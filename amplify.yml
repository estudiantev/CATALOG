version: 1
backend:
  phases:
    build:
      commands:
        # Si @aws-amplify/data-construct vuelve a dejar el lock incompleto, se instala con npm install
        - npm ci --cache .npm --prefer-offline || npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        # Con la caché del build anterior, la revisión de tipos pasa de los 2 GB que Node usa por defecto
        - NODE_OPTIONS=--max-old-space-size=6144 npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*